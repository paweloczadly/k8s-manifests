apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backend-app
spec:
  interval: 10m0s
  path: ./apps/.base/backend-app/1.83/types/standard-instance
  targetNamespace: provisioner-test
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  commonMetadata:
    labels:
      infra.oczadly.io/instance-tier: "trials"
  postBuild:
    substitute:
      releaseChannel: "stable"
      nodeSelector: "backend"
    substituteFrom:
      - kind: ConfigMap
        name: instance-aws-config
